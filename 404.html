<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sekhar Teaching Hub - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License https://github.com/rafgraph/spa-github-pages
      // This script intercepts 404s for dynamic routes on GitHub Pages static hosting
      // (e.g. /smartboard/pcb3 or /smartboard/pcb3/ch-1) and redirects to the root SPA
      // with the route preserved in query string format (?/pcb3/ch-1).
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var pathSegmentsToKeep = pathname.startsWith('/smartboard') ? 1 : 0;

        var prefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var hash = l.hash || '';

        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          prefix + '/?/' + route + search + hash;

        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: #94a3b8;">
    <p>Loading Sekhar Teaching Hub...</p>
  </body>
</html>
