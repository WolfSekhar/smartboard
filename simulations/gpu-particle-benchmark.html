<!DOCTYPE html>
<html lang="en">
<!-- =========================================================================
     SEKHAR TEACHING HUB — GPU PARTICLE & MANY-BODY STRESS BENCHMARK
     DESIGN SYSTEM: GTK4 / Libadwaita (GNOME 45+ HIG) — Zero-Radius Standard
     ARCHITECTURE: SekharSimUI v2.0.0 (Zero-CSS & Zero-DOM Standard)
     CAPACITY: Up to 10,000 Particles with 1000Hz Fixed-Timestep Physics Loop
     ========================================================================= -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPU Particle & Many-Body Stress Benchmark</title>

  <!-- Multi-Tier Resilient SekharSimUI Loader -->
  <script src="../lib/sekhar-sim-ui.min.js"></script>
  <script>window.SekharSimUI || document.write('<script src="/lib/sekhar-sim-ui.min.js"><\/script>')</script>
  <script>window.SekharSimUI || document.write('<script src="https://cdn.jsdelivr.net/gh/WolfSekhar/smartboard@main/lib/sekhar-sim-ui.min.js"><\/script>')</script>
  <script>window.SekharSimUI || document.write('<script src="https://wolfsekhar.github.io/smartboard/lib/sekhar-sim-ui.min.js"><\/script>')</script>
</head>
<body>
  <script>
    // --- 1. SIMULATION STATE & BUFFERS ---
    const MAX_PARTICLES = 10000;
    const pX = new Float32Array(MAX_PARTICLES);
    const pY = new Float32Array(MAX_PARTICLES);
    const pVx = new Float32Array(MAX_PARTICLES);
    const pVy = new Float32Array(MAX_PARTICLES);
    const pCharge = new Float32Array(MAX_PARTICLES);
    const pSpeed = new Float32Array(MAX_PARTICLES);

    let isRunning = false;
    let currentMode = "galaxy"; // "galaxy" | "gas" | "dipole"
    let canvasWidth = 800;
    let canvasHeight = 500;

    // Performance Metrics
    let lastFrameTime = performance.now();
    const frameTimes = new Float32Array(60);
    let frameTimeIndex = 0;
    let avgFrameTimeMs = 16.6;
    let fps = 60.0;
    let megaCalcsPerSec = "0.0";
    let physicsAccumulator = 0;
    const MICRO_DT = 0.001; // 1000 Hz micro-stepping

    // Interactive Pointer Well
    const mousePos = { x: 0, y: 0, active: false };

    // --- 2. DECLARATIVE SEKHAR-SIM-UI HUD & GUI ---
    const sim = new SekharSimUI({
      title: "GPU Particle Stress Lab",
      subtitle: "High-Throughput Many-Body Benchmark",
      sliders: [
        { id: "particles", label: "Particle Stress Count (N)", min: 100, max: 10000, step: 100, value: 1000 },
        { id: "gStrength", label: "Attractor Strength (G)", min: 0.1, max: 4.0, step: 0.1, value: 1.5 },
        { id: "particleRadius", label: "Particle Radius", min: 1.0, max: 6.0, step: 0.5, value: 2.0, unit: "px" },
        { id: "trailAlpha", label: "Motion Blur Trail", min: 0, max: 0.85, step: 0.05, value: 0.4 }
      ],
      toggles: [
        { id: "mouseWell", label: "Interactive Mouse Attractor", checked: false },
        { id: "showMaxwell", label: "Maxwell-Boltzmann Histogram", checked: false },
        { id: "showGrid", label: "Cartesian Grid Reticle", checked: false }
      ],
      presets: [
        { label: "Galaxy N-Body (1k)", values: { particles: 1000, gStrength: 1.5, particleRadius: 2.0, trailAlpha: 0.4 } },
        { label: "Kinetic Gas (3k)", values: { particles: 3000, gStrength: 0.5, particleRadius: 2.5, trailAlpha: 0.2 } },
        { label: "Dipole Flux (5k)", values: { particles: 5000, gStrength: 2.0, particleRadius: 1.5, trailAlpha: 0.45 } },
        { label: "10k Extreme Stress", values: { particles: 10000, gStrength: 2.5, particleRadius: 1.0, trailAlpha: 0.6 } }
      ],
      hud: ["fps", "frame_time", "active_load", "throughput"],
      onPlayChange: (running) => {
        isRunning = running;
        lastFrameTime = performance.now();
      },
      onReset: () => reseedParticles(),
      onControlChange: (id) => {
        if (id === "particles") reseedParticles();
      },
      onResize: (w, h) => resizeCanvas(w, h)
    });

    // Detect mode selection based on preset labels
    const origApplyPreset = sim.applyPreset.bind(sim);
    sim.applyPreset = function (presetMap) {
      if (presetMap.particles === 3000) currentMode = "gas";
      else if (presetMap.particles === 5000) currentMode = "dipole";
      else currentMode = "galaxy";
      origApplyPreset(presetMap);
      reseedParticles();
    };

    // --- 3. CANVAS ATTACHMENT & RESIZING ---
    const canvas = document.createElement("canvas");
    canvas.id = "simCanvas";
    sim.canvasHost.appendChild(canvas);
    const ctx = canvas.getContext("2d", { alpha: false });

    function resizeCanvas(w, h) {
      canvasWidth = w || sim.width;
      canvasHeight = h || sim.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvasWidth * dpr);
      canvas.height = Math.round(canvasHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Interactive Pointer Well Events
    sim.canvasContainer.addEventListener("pointerdown", (e) => {
      const rect = sim.canvasContainer.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
      mousePos.active = true;
    });

    sim.canvasContainer.addEventListener("pointermove", (e) => {
      const rect = sim.canvasContainer.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    const stopMouse = () => { mousePos.active = false; };
    sim.canvasContainer.addEventListener("pointerup", stopMouse);
    sim.canvasContainer.addEventListener("pointerleave", stopMouse);

    // --- 4. PARTICLE RESEEDING & COLORMAPPING ---
    function reseedParticles() {
      const cx = canvasWidth / 2;
      const cy = canvasHeight / 2;
      const count = Math.min(MAX_PARTICLES, sim.get("particles") || 1000);
      const g = sim.get("gStrength") || 1.5;

      for (let i = 0; i < count; i++) {
        if (currentMode === "galaxy") {
          const r = 25 + Math.random() * Math.min(cx, cy) * 0.85;
          const theta = Math.random() * Math.PI * 2;
          pX[i] = cx + r * Math.cos(theta);
          pY[i] = cy + r * Math.sin(theta);
          const vOrb = Math.sqrt((g * 2500) / r);
          pVx[i] = -vOrb * Math.sin(theta) + (Math.random() - 0.5) * 5;
          pVy[i] = vOrb * Math.cos(theta) + (Math.random() - 0.5) * 5;
        } else if (currentMode === "gas") {
          pX[i] = 20 + Math.random() * Math.max(20, canvasWidth - 40);
          pY[i] = 20 + Math.random() * Math.max(20, canvasHeight - 40);
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 120;
          pVx[i] = speed * Math.cos(angle);
          pVy[i] = speed * Math.sin(angle);
        } else if (currentMode === "dipole") {
          pX[i] = Math.random() * canvasWidth;
          pY[i] = Math.random() * canvasHeight;
          pCharge[i] = Math.random() > 0.5 ? 1 : -1;
          pVx[i] = (Math.random() - 0.5) * 20;
          pVy[i] = (Math.random() - 0.5) * 20;
        }
        pSpeed[i] = Math.hypot(pVx[i], pVy[i]);
      }
    }

    function getParticleColor(speed, charge) {
      if (currentMode === "dipole") {
        return charge > 0 ? sim.theme.coral : sim.theme.accent;
      }
      // Thermal Velocity Spectrum (Theme Aware)
      const norm = Math.min(1.0, speed / 180);
      if (norm < 0.33) return sim.theme.accent;
      if (norm < 0.66) return sim.theme.emerald;
      if (norm < 0.88) return sim.theme.gold;
      return sim.theme.coral;
    }

    // --- 5. 1000 HZ VSYNC MICRO-STEPPING ENGINE & RENDER LOOP ---
    function draw() {
      if (canvasWidth <= 0 || canvas.width === 0) {
        resizeCanvas();
      }

      const now = performance.now();
      let dt_real = (now - lastFrameTime) / 1000;
      const frameDeltaMs = now - lastFrameTime;
      lastFrameTime = now;

      // Rolling Performance Metrics
      frameTimes[frameTimeIndex] = frameDeltaMs;
      frameTimeIndex = (frameTimeIndex + 1) % frameTimes.length;
      let sumTime = 0;
      for (let i = 0; i < frameTimes.length; i++) sumTime += frameTimes[i];
      avgFrameTimeMs = sumTime / frameTimes.length;
      fps = Math.min(240, 1000 / Math.max(1, avgFrameTimeMs));

      const particleCount = Math.min(MAX_PARTICLES, Math.round(sim.get("particles") || 1000));
      const gStrength = sim.get("gStrength") || 1.5;
      const particleRadius = sim.get("particleRadius") || 2.0;
      const motionTrailAlpha = sim.get("trailAlpha") || 0.4;
      const interactiveMouse = sim.get("mouseWell") && mousePos.active;

      megaCalcsPerSec = ((particleCount * 1000) / 1000000).toFixed(1);

      if (dt_real > 0.1) dt_real = 0.1; // Guard against tab switching lag

      // 1000 Hz Sub-Stepping Physics
      if (isRunning) {
        physicsAccumulator += dt_real * sim.speed;
        const cx = canvasWidth / 2;
        const cy = canvasHeight / 2;

        let steps = 0;
        while (physicsAccumulator >= MICRO_DT && steps < 60) {
          const dt = MICRO_DT;

          for (let i = 0; i < particleCount; i++) {
            let fx = 0;
            let fy = 0;

            if (currentMode === "galaxy") {
              const dx = cx - pX[i];
              const dy = cy - pY[i];
              const distSq = dx * dx + dy * dy + 400;
              const dist = Math.sqrt(distSq);
              const force = (gStrength * 250000) / distSq;
              fx += force * (dx / dist);
              fy += force * (dy / dist);

              if (interactiveMouse) {
                const mdx = mousePos.x - pX[i];
                const mdy = mousePos.y - pY[i];
                const mDistSq = mdx * mdx + mdy * mdy + 300;
                const mDist = Math.sqrt(mDistSq);
                const mForce = (gStrength * 350000) / mDistSq;
                fx += mForce * (mdx / mDist);
                fy += mForce * (mdy / mDist);
              }
            } else if (currentMode === "gas") {
              if (pX[i] <= 5 && pVx[i] < 0) pVx[i] = -pVx[i];
              if (pX[i] >= canvasWidth - 5 && pVx[i] > 0) pVx[i] = -pVx[i];
              if (pY[i] <= 5 && pVy[i] < 0) pVy[i] = -pVy[i];
              if (pY[i] >= canvasHeight - 5 && pVy[i] > 0) pVy[i] = -pVy[i];

              if (interactiveMouse) {
                const mdx = mousePos.x - pX[i];
                const mdy = mousePos.y - pY[i];
                const mDistSq = mdx * mdx + mdy * mdy + 100;
                if (mDistSq < 15000) {
                  const mDist = Math.sqrt(mDistSq);
                  const mForce = 8000 / mDistSq;
                  fx -= mForce * (mdx / mDist);
                  fy -= mForce * (mdy / mDist);
                }
              }
            } else if (currentMode === "dipole") {
              const p1x = cx - 120; const p1y = cy;
              const p2x = cx + 120; const p2y = cy;

              const d1x = p1x - pX[i]; const d1y = p1y - pY[i];
              const r1Sq = d1x * d1x + d1y * d1y + 300;
              const r1 = Math.sqrt(r1Sq);
              const f1 = (pCharge[i] * 120000) / r1Sq;
              fx += f1 * (d1x / r1);
              fy += f1 * (d1y / r1);

              const d2x = p2x - pX[i]; const d2y = p2y - pY[i];
              const r2Sq = d2x * d2x + d2y * d2y + 300;
              const r2 = Math.sqrt(r2Sq);
              const f2 = (-pCharge[i] * 120000) / r2Sq;
              fx += f2 * (d2x / r2);
              fy += f2 * (d2y / r2);
            }

            pVx[i] += fx * dt;
            pVy[i] += fy * dt;
            pX[i] += pVx[i] * dt;
            pY[i] += pVy[i] * dt;
            pSpeed[i] = Math.hypot(pVx[i], pVy[i]);
          }

          physicsAccumulator -= MICRO_DT;
          steps++;
        }
      }

      // --- RENDERING PIPELINE ---
      const bgClr = sim.theme.isDark ? "rgba(24, 24, 27, " : "rgba(255, 255, 255, ";
      const fadeAlpha = Math.max(0.1, 1.0 - motionTrailAlpha);
      ctx.fillStyle = bgClr + fadeAlpha + ")";
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      // Optional Cartesian Grid
      if (sim.get("showGrid")) {
        ctx.strokeStyle = sim.theme.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x < canvasWidth; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvasHeight); }
        for (let y = 0; y < canvasHeight; y += 40) { ctx.moveTo(0, y); ctx.lineTo(canvasWidth, y); }
        ctx.stroke();
      }

      // Render Central Attractor Glow
      const cx = canvasWidth / 2;
      const cy = canvasHeight / 2;

      if (currentMode === "galaxy") {
        const radGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 28);
        radGrad.addColorStop(0, "#ffffff");
        radGrad.addColorStop(0.3, sim.theme.accent);
        radGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = radGrad;
        ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.fill();
      } else if (currentMode === "dipole") {
        ctx.fillStyle = sim.theme.coral;
        ctx.beginPath(); ctx.arc(cx - 120, cy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = sim.theme.accent;
        ctx.beginPath(); ctx.arc(cx + 120, cy, 10, 0, Math.PI * 2); ctx.fill();
      }

      // Interactive Mouse Attractor Indicator
      if (interactiveMouse) {
        ctx.strokeStyle = sim.theme.accent;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, 14, 0, Math.PI * 2); ctx.stroke();
      }

      // High-Performance Batched Particle Rendering
      const rad = particleRadius;
      for (let i = 0; i < particleCount; i++) {
        ctx.fillStyle = getParticleColor(pSpeed[i], pCharge[i]);
        ctx.beginPath();
        ctx.arc(pX[i], pY[i], rad, 0, Math.PI * 2);
        ctx.fill();
      }

      // Optional On-Canvas Maxwell-Boltzmann Distribution Histogram
      if (sim.get("showMaxwell")) {
        ctx.save();
        const mw = 200; const mh = 70;
        const mx = canvasWidth - mw - 20; const my = canvasHeight - mh - 50;

        ctx.fillStyle = sim.theme.isDark ? "rgba(34, 34, 38, 0.92)" : "rgba(244, 244, 246, 0.92)";
        ctx.strokeStyle = sim.theme.border;
        ctx.lineWidth = 1;
        ctx.fillRect(mx, my, mw, mh);
        ctx.strokeRect(mx, my, mw, mh);

        ctx.font = "600 9px -apple-system, sans-serif";
        ctx.fillStyle = sim.theme.subtitle;
        ctx.fillText("Maxwell-Boltzmann v-Distribution", mx + 8, my + 12);

        const bins = new Uint16Array(20);
        for (let i = 0; i < particleCount; i++) {
          const b = Math.min(19, Math.floor((pSpeed[i] / 200) * 20));
          bins[b]++;
        }
        let maxBin = 1;
        for (let b = 0; b < 20; b++) if (bins[b] > maxBin) maxBin = bins[b];

        const barW = (mw - 16) / 20;
        for (let b = 0; b < 20; b++) {
          const barH = (bins[b] / maxBin) * (mh - 22);
          ctx.fillStyle = sim.theme.accent;
          ctx.fillRect(mx + 8 + b * barW, my + mh - 4 - barH, barW - 1.5, barH);
        }
        ctx.restore();
      }

      // Live HUD Telemetry via SekharSimUI
      sim.setHud({
        fps: `${fps.toFixed(1)} fps`,
        frame_time: `${avgFrameTimeMs.toFixed(2)} ms`,
        active_load: `${particleCount.toLocaleString()} pts`,
        throughput: `${megaCalcsPerSec} MCalcs/s`
      });

      requestAnimationFrame(draw);
    }

    // Startup Initialization
    window.addEventListener("DOMContentLoaded", () => {
      resizeCanvas();
      reseedParticles();
      lastFrameTime = performance.now();
      requestAnimationFrame(draw);
    });
  </script>
</body>
</html>
